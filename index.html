<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditações - Nova Tabernáculo Batista</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f7fafc;
    color: #1a202c;
    margin: 0;
    padding: 20px;
    font-size: 20px;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
    color: #fff;
    padding: 30px 20px;
    text-align: center;
    border-radius: 16px;
    margin-bottom: 24px;
  }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 4px 0; opacity: .95; }
  .card {
    background: #fff;
    border-left: 8px solid #b7791f;
    padding: 20px 24px;
    margin: 14px 0;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: transform .2s;
  }
  .card:hover { transform: translateX(6px); }
  .card a {
    color: #2c5282;
    font-weight: bold;
    text-decoration: none;
    font-size: 22px;
  }
  .card a:hover { text-decoration: underline; }
  .card p { margin: 6px 0 0; color: #4a5568; font-size: 17px; }
  footer {
    text-align: center;
    color: #718096;
    font-size: 15px;
    margin-top: 40px;
    padding: 20px;
    border-top: 2px solid #cbd5e0;
  }
</style>
</head>
<body>

<header>
  <h1>📖 Meditações</h1>
  <p><strong>Nova Tabernáculo Batista</strong></p>
  <p>Toque em uma meditação para abrir</p>
</header>
